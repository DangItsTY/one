<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>onelist</title>
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#a6ffee" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico" />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <link rel="stylesheet" type="text/css" href="../libs/styles.css" />
    <link rel="stylesheet" type="text/css" href="styles.css" />
  </head>
  <body>
    <main>
      <section id="notes" name="notes"></section>
      <section id="future" name="future" class="future">
        <button type="button" onclick="future()">See the Future!</button>
      </section>
    </main>
    <template id="noteTemplate" name="noteTemplate">
      <article name="onenote" class="onenote">
        <p name="note" class="note"></p>
        <button type="button" onclick="deleteNote(event)">Delete</button>
        <button type="button" onclick="saveNote(event)">--></button>
      </article>
    </template>
    <script src="../libs/oneschema.js"></script>
    <script src="../libs/scripts.js"></script>
    <script src="scripts.js"></script>
    <script src="../libs/pwa-register.js"></script>
  </body>
</html>
