<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>oneschema</title>
<link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
<main>
<section>
<input id="noteInput" name="noteInput" type="text" placeholder="Enter new note...">
<input id="categoryInput" name="categoryInput" type="text" placeholder="With category...">
<input id="deadlineInput" name="deadlineInput" type="date" placeholder="With deadline...">
</section>
<section id="notes" name="notes"></section>
</main>
<template id="noteTemplate">
<article class="note" draggable="true">
	<textarea name="note"></textarea>
	<input type="text" name="category" placeholder="category">
	<button type="button">Delete</button>
</article>
</template>
</body>
<script src="oneschema.js"></script>
<script src="../libs/drag.js"></script>
<script src="scripts.js"></script>
</html>
