<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>noteD</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
	<main>
		<section id="edit" class="edit">
			<form onsubmit="add()">
				<input id="editInput" type="text" placeholder="One liner...">
				<input type="date" id="date">
				<input type="time" id="time">
				<input type="datetime" id="datetime">
			</form>
		</section>
		<section class="bubble">
			<button id="add" class="add" onclick="toggleEdit()">+</button>
			<button id="left" class="left" onclick="goLeft()"><</button>
			<button id="right" class="right" onclick="goRight()">></button>
		</section>
		<section id="list" class="todo-style">
			<!-- <article class="item">
				<input type="checkbox">
				<span>Task 1</span>
				<span>More description...</span>
				<span>Footer notes here</span>
			</article> -->
		</section>
		<section id="clear">
			<button id="clearButton" ondrag="clearList(false)" onmouseup="clearList(true)">Clear</button>
		</section>
		<section class="cover">
			<p id="cover"></p>
		</section>
	</main>
<script>
	if('serviceWorker' in navigator) {
		navigator.serviceWorker.register('/sw.js', { scope: '/' })
		  .then(function(registration) {
				console.log('Service Worker Registered');
		  });
		navigator.serviceWorker.ready.then(function(registration) {
		   console.log('Service Worker Ready');
		});
	}
	/*
	Laggy checkbox
	*/
</script>
<script src="game.js"></script>
</body>
</html>
